<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Archive · Daan Walder</title>
<meta name="theme-color" content="#f1f0eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%23254fff%22/%3E%3C/svg%3E">
<script>(function(h){if(!matchMedia('(prefers-reduced-motion: reduce)').matches)h.classList.add('motion')})(document.documentElement)</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="name" href="#" data-home>Memory Archive</a>
  <span class="live"><span class="dot" aria-hidden="true"></span><span class="label" id="status">Receiving</span></span>
  <nav class="nav" aria-label="Lenses">
    <a href="#index" data-view="index"><span>Index</span></a>
    <a href="#wall" data-view="wall"><span>Wall</span></a>
    <a href="#constellation" data-view="constellation"><span>Constellation</span></a>
    <a href="#lineage" data-view="lineage"><span>Lineage</span></a>
  </nav>
</header>

<main id="main">
  <section class="wrap page-title">
    <h1 class="huge" id="lens-title">Index</h1>
    <p id="lens-note"></p>
  </section>

  <section class="wrap toolbar" aria-label="Filters">
    <div class="group" role="group" aria-label="Resonance" id="res-filter"></div>
    <div class="group tools">
      <label class="search"><span class="visually-hidden">Search</span><input id="search" type="search" placeholder="Search" autocomplete="off"><kbd>/</kbd></label>
      <button class="action" id="tags-toggle" aria-expanded="false" aria-controls="tag-panel"><span>Tags</span></button>
      <button class="action" id="drift" title="Surface something you haven't looked at in a while"><span>Drift</span></button>
      <button class="action action--signal" id="add"><span class="dot" aria-hidden="true"></span><span>Capture</span></button>
    </div>
  </section>
  <section class="wrap tag-panel" id="tag-panel" hidden></section>

  <section id="view" class="view" aria-live="polite"></section>
</main>

<footer class="wrap site-foot">
  <span class="label">Stored in this browser only</span>
  <div class="group">
    <button class="label link-quiet" id="export">Export .json</button>
    <label class="label link-quiet">Import<input id="import" type="file" accept="application/json" hidden></label>
    <button class="label link-quiet" id="clear-examples">Remove examples</button>
  </div>
  <span class="label keys">N new · / search · 1–4 lenses · ← → browse</span>
</footer>

<!-- Entry panel -->
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" aria-label="Entry" inert></aside>

<!-- Capture sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" inert>
  <div class="sheet-top wrap">
    <span class="name" id="sheet-title">New entry</span>
    <span class="label sheet-hint">Paste a link or image anywhere to start one</span>
    <button class="action" type="button" data-sheet-close><span>Close</span></button>
  </div>
  <form class="wrap sheet-body" id="capture-form" novalidate>
    <div class="sheet-form">
      <fieldset class="chips" id="type-chips"><legend class="label">What is it</legend></fieldset>
      <div class="field"><label class="label" for="f-title">Title</label><input id="f-title" name="title" autocomplete="off" placeholder="A name for it" required></div>
      <div class="field"><label class="label" for="f-body">Note</label><textarea id="f-body" name="body" rows="3" placeholder="What is it, and why does it stay with you?"></textarea></div>
      <div class="field" data-for="url"><label class="label" for="f-url">Link</label><input id="f-url" name="url" type="url" placeholder="https://"></div>
      <fieldset class="chips" id="res-chips"><legend class="label">It</legend></fieldset>
      <div class="two">
        <div class="field"><label class="label" for="f-date">Entered my life</label><input id="f-date" name="date" type="date"></div>
        <div class="field"><label class="label" for="f-tags">Tags</label><input id="f-tags" name="tags" autocomplete="off" placeholder="sea, repetition"></div>
      </div>
      <div class="sheet-actions">
        <button class="action action--signal" type="submit"><span class="dot" aria-hidden="true"></span><span>Save entry</span></button>
        <span class="label">⌘ ↵</span>
      </div>
    </div>
    <label class="drop" id="drop">
      <input type="file" name="media" id="f-media" hidden>
      <span class="drop-empty"><span class="label">Image or file</span><span class="drop-big">Drop, paste<br>or choose</span></span>
      <span class="drop-preview" id="drop-preview"></span>
    </label>
  </form>
</div>

<div class="dropzone" id="dropzone"><span class="label"><span class="dot"></span>Release to receive</span></div>
<div class="toast label" id="toast" role="status"></div>
<div class="preview" id="preview"></div>
<div class="preview-dot" id="preview-dot"></div>

<script src="app.js"></script>
</body>
</html>
